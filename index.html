<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8"> <!-- sin esto las tildes y la ñ salen mal -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="estilos.css"> <!-- vincula el CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <form class="mx-auto">
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">Tarea</label>
                    <div class="col-sm-10">
                        <input type="text" id="textoTarea" />
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">Categoria </label>
                    <div class="col-sm-10">
                        <select name="opciones" id="categoria">
                            <option value="trabajo">Trabajo</option>
                            <option value="estudio" selected>Estudio</option>
                            <option value="personal">Personal</option>
                            <option value="urgente">Urgente</option>
                            <option value="otra">Otra</option>
                        </select>
                    </div>
                </div>
                <div id="divOtraCategoria">
                    <label id="labelOtraCategoria">Ingrese la categoria</label><input type="text"
                        id="textoOtraCategoria" /><br>
                </div>
                <div class="form-group row">
                    <div class="col-sm-10">
                        <input type="button" value="Agregar Tarea" id="botonAgregar" class="btn btn-primary" />
                    </div>
                </div>
            </form>
        </div>
    </div>
    <span id="mensajeError"></span>
    <!-- todo lo visible va aquí -->
    <div class="row justify-content-center">
        <div id="listaTareas" class="col-12 col-md-6 col-lg-4">
        </div>
    </div>
    <script src="app.js"></script> <!--SIEMPRE al final del body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html
